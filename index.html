<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blaulichtblicke_Zollernalb | Pressefotografie</title>
    <style>
        /* Hochmodernes, mobil-optimiertes Cyber-Presse-Design */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        body { 
            background-color: #08090c; 
            color: #f1f5f9; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Header & Navigation (Perfekt für Touch-Bedienung auf dem iPad) */
        header { 
            background: rgba(13, 17, 23, 0.95); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 20px; 
            border-bottom: 2px solid #0066ff; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .nav-container { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            align-items: center; 
        }
        @media (min-width: 768px) {
            .nav-container { flex-direction: row; justify-content: space-between; gap: 0; }
        }
        
        .logo { 
            font-size: 20px; 
            font-weight: 900; 
            color: #fff; 
            text-transform: uppercase;
            letter-spacing: 1px; 
            white-space: nowrap;
        }
        .logo span { 
            color: #0066ff; 
            text-shadow: 0 0 10px rgba(0, 102, 255, 0.5);
        }

        nav { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        nav a { 
            color: #94a3b8; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 13px; 
            text-transform: uppercase; 
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        nav a:active, nav a.active { 
            color: #fff; 
            background: #0066ff;
            border-color: #0066ff;
            box-shadow: 0 0 12px rgba(0, 102, 255, 0.4);
        }

        /* Sektionen-Logik */
        section { display: none; padding: 30px 15px; max-width: 1200px; margin: 0 auto; }
        section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Startseite (Hero-Bereich ohne abgeschnittene Schrift) */
        .hero {
            background: linear-gradient(135px, rgba(8,9,12,0.95) 50%, rgba(0,102,255,0.15)), 
                        url('https://unsplash.com') no-repeat center/cover;
            padding: 50px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 30px;
            text-align: left;
        }
        .badge-live {
            display: inline-flex;
            align-items: center;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-bottom: 15px;
        }
        .hero h1 { font-size: 28px; font-weight: 900; line-height: 1.2; color: #fff; margin-bottom: 15px; }
        .hero p { font-size: 15px; color: #94a3b8; max-width: 550px; line-height: 1.5; }
        @media (min-width: 768px) {
            .hero { padding: 80px 40px; }
            .hero h1 { font-size: 42px; }
            .hero p { font-size: 17px; }
        }

        /* Raster-Layout für Features (Kompakt auf iPads) */
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .feature-card { background: #111319; border: 1px solid rgba(255,255,255,0.03); padding: 25px; border-radius: 10px; }
        .feature-card h3 { font-size: 18px; color: #fff; margin-bottom: 10px; }
        .feature-card p { color: #94a3b8; font-size: 14px; line-height: 1.5; }

        /* Galerie (Saubere Karten-Struktur) */
        .section-title { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .gallery-filter { display: flex; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
        .filter-btn { background: #111319; border: 1px solid rgba(255,255,255,0.05); color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .filter-btn.active { background: #0066ff; border-color: #0066ff; box-shadow: 0 0 10px rgba(0,102,255,0.3); }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
        .gallery-item { background: #111319; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.03); display: flex; flex-direction: column; }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; display: block; cursor: pointer; }
        .gallery-info { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
        .gallery-info h3 { font-size: 16px; color: #fff; font-weight: 700; line-height: 1.3; }
        .gallery-info p { color: #94a3b8; font-size: 13px; line-height: 1.4; }
        .badge { display: inline-block; background: #0066ff; color: #fff; padding: 3px 8px; font-size: 10px; border-radius: 4px; font-weight: 800; text-transform: uppercase; align-self: flex-start; }

        /* Kontaktformular (Schlank und übersichtlich) */
        .contact-form { background: #111319; padding: 25px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.03); max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; color: #94a3b8; font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; background: #08090c; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-size: 14px; -webkit-appearance: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #0066ff; outline: none; }
        .submit-btn { background: #0066ff; color: #fff; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: 700; width: 100%; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }

        /* Vollbild Lightbox für iPad-Klicks */
        .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 10px; }
        .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 6px; object-fit: contain; }
        .lightbox-close { position: absolute; top: 15px; right: 20px; color: #fff; font-size: 35px; font-weight: bold; cursor: pointer; padding: 10px; }

        footer { text-align: center; padding: 30px; font-size: 12px; color: #475569; border-top: 1px solid rgba(255,255,255,0.02); margin-top: 40px; }
    </style>
</head>
